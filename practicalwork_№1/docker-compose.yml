services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: lakehouse-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  postgres:
    image: postgres:17
    container_name: lakehouse-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:latest-main
    command: migrate
    environment: &lakekeeper-env
      LAKEKEEPER__PG_ENCRYPTION_KEY: "This-is-NOT-Secure!"
      LAKEKEEPER__PG_DATABASE_URL_READ: "postgresql://postgres:postgres@postgres:5432/postgres"
      LAKEKEEPER__PG_DATABASE_URL_WRITE: "postgresql://postgres:postgres@postgres:5432/postgres"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  lakekeeper:
    image: quay.io/lakekeeper/catalog:latest-main
    container_name: lakekeeper
    command: serve
    environment: *lakekeeper-env
    ports:
      - "8181:8181"
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully

  trino:
    image: trinodb/trino:476
    container_name: trino
    ports:
      - "8080:8080"
    volumes:
      - ./catalog:/etc/trino/catalog
    depends_on:
      - lakekeeper
      - minio

  superset:
    image: apache/superset:latest
    container_name: lakehouse-superset
    user: root
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "local-lakehouse-practical-work-secret-key"
    depends_on:
      - trino
    volumes:
      - superset-data:/app/superset_home
    command:
      - /bin/sh
      - -c
      - |
        uv pip install --python /app/.venv/bin/python trino sqlalchemy-trino &&
        exec /app/docker/entrypoints/run-server.sh

volumes:
  minio-data:
  pg-data:
  superset-data:
